# All tunables live here. Never hardcode these in modules.

encoder:
  backend: dinov2          # dinov2 (Meta, ViT-S/14, 384-dim) | radio (NVIDIA C-RADIO, 2304-dim)

  # torch.hub name; small = ViT-S/14, 384-dim embeddings

  name: dinov2_vits14

  input_size: 224          # square resize; multiple of the patch size (14 for DINOv2, 16 for RADIO)

  device: cpu

  batch_size: 16

detector:
  name: yolo11n

  model_path: data/models/yolo11n_768.onnx

  input_size: 768          # the ONNX graph is exported at a fixed input size, so this must match the
                           # file above. 768 is the clip's native width: at 640 the frame was letterboxed
                           # DOWN, discarding pixels already in hand, and people bunched at a distance are
                           # only 17-27 px wide. Measured over 40 frames: 640 finds 5.1 people/frame in
                           # 161 ms, 768 finds 5.7 in 201 ms, 960 finds 4.5 in 294 ms. 960 is worse as
                           # well as slower because YOLO11n is trained at 640 and upsampling puts people
                           # at a scale it never saw. Re-export with `yolo export format=onnx imgsz=768`.

  conf_threshold: 0.1

  iou_threshold: 0.50

  classes: null            # list of COCO ids to keep, or null for all

  num_threads: 0           # 0 = onnxruntime default

tracker:
  max_age: 12             # frames without a match before a track is lost. A person walking behind
                          # something is invisible to the detector for ~12 frames; at 6 the track
                          # expired first and came back as a new id. Raising it doubles median track
                          # life (5.7s -> 11.1s) and cuts identities 25 -> 20 with coverage unchanged.
                          # Only safe because stale tracks are no longer drawn and the appearance veto
                          # now blocks the bad re-associations a long memory would otherwise allow.

  min_hits: 2             # matches before a track is drawn; 1 admits detector junk (67 ids, 37 spurious), 3 only adds latency

  iou_threshold: 0.3      # IoU at or above this accepts a match outright; below it the centre gate decides

  contested_iou: 0.5      # a detection this deep inside two tracks at once is not safely attributable;
                          # withhold it and let both coast rather than guess and swap their ids
  max_centre_distance: 1.5  # fallback gate in box widths, for the ~6% of true matches that fall under iou_threshold.

                            # Tuned at detect_every_n_frames: 3 - motion per interval scales with the frame skip,

                            # so raising that cadence needs this raised too (roughly 0.7 x the gap in frames).

  measurement_noise: 0.25   # how much the filter distrusts a detection, relative to its own prediction.
                            # Below 1.0 means detections win: the corrected box lands on the detection
                            # (overlap 0.929 -> 0.966) instead of trailing two thirds of the way there,
                            # which is what made a box look slow to recover after an occlusion. Pushing
                            # it lower still fits velocity to detection jitter and costs track ids.

  high_conf: 0.5           # detections >= this go to the first association pass

  low_conf: 0.1            # detections in [low_conf, high_conf) go to the second (ByteTrack) pass

  veto_views: 3           # how many recent observations a track offers the veto; a running mean
                          # resembles none of the views it averages, so raw observations compare better
  claim_margin: 0.0       # refuse a match when a rival track's appearance fits the detection this much
                          # better. Measured too blunt: at 0.10 it cuts id theft 20 -> 6 but costs 8 extra
                          # identities and 2% coverage, so it is off. Appearance in the cost does the same
                          # job more cheaply.
  appearance_veto: 0.4    # reject a match whose appearance is implausible for the same object.
                          # ONLY ACTIVE when the caller passes embeddings into update(); track_demo and
                          # reid_demo do not, so it is inert there. At 0.5 it costs identities (18 -> 20)
                          # by rejecting correct matches whose embedding is briefly unstable.
  appearance_weight: 0.5  # share of the association cost taken from appearance rather than geometry.
                          # Two overlapping people have near-identical geometry, so this is what stops
                          # one of them claiming the other's id: measured id theft 20 -> 14 with identity
                          # count, coverage and track lifetime all unchanged. Needs embeddings at update().  # lambda in cost = (1-lambda)*(1-IoU) + lambda*(1-cosine); 0 = motion only

  embed_every_n: 2       # schedule for due_for_embedding(); callers passing embeddings into update() rate-limit themselves. 0 disables

  max_exemplars: 16      # per-track appearance buffer; crops are not stored, so this is all a lost track can hand to memory

memory:
  db_path: data/memory.db

  index_path: data/memory.faiss

  exemplars_per_identity: 5   # K

  reid_threshold: 0.80        # cosine, tune after Phase 7

reid:
  verifier: cosine        # cosine | logistic
  min_pair_gap: 2         # observations apart, so a positive pair is not two near-identical frames
  max_pairs_per_track: 200 # cap per track, or one long-lived object dominates the positive class
  max_false_merge_rate: 0.02 # share of provably-different pairs the binding boundary may accept.
                            # Showing a viewer the wrong name is worse than failing to recognize
                            # someone, so the boundary is set by this rather than by balanced error.
                            # 0.02 was argued for, never measured; scored against MOT17-02's labelled
                            # identities it puts the boundary at 0.704, which is below the useful band.
                            # Sweeping the boundary end to end: no re-id at all gives IDF1 45.3% with
                            # 30 identity switches, and 0.704 gives 45.9% with 32 - barely above doing
                            # nothing, and swapping MORE numbers. 0.720-0.775 is a flat optimum at
                            # 46.1-46.5% with 29 switches. Below 0.70 re-id is actively destructive:
                            # 0.55 collapses to 36.9% with 53 switches, far worse than not binding at
                            # all, because a wrong merge costs more identity than a correct recovery
                            # gains. This rate is NOT independent of observation_quantile: raising
                            # that to 0.9 lifts every score, so the same 2% now lands at 0.755 where
                            # it once landed at 0.704. Re-swept at that quantile, 0.723-0.773 is flat
                            # at 47.0-47.3% IDF1 with 29 switches and 0.800 collapses back to the
                            # floor, so the boundary is placed mid-band rather than at the peak.
  claim_margin: 0.08      # how much better a match must be to take an identity from its current
                          # holder. Two similar-looking people both score against one stored
                          # record, and without this whichever appeared first keeps it for good.
  merge_margin: 0.05      # extra evidence needed to merge two existing records, beyond what a fresh
                          # binding needs. Merging rewrites history, so it should be the harder call.
  reconsider_every: 15    # frames between revisiting a track's identity as its evidence grows. An
                          # identity assigned from two observations must be allowed to improve, or an
                          # object called new can never reclaim the record of its earlier visit.
  continuity_bonus: 0.15  # how much the appearance bar may be lowered for an object that reappears where
                          # another vanished moments ago. Appearance across a gap is weak; continuity in
                          # space and time is strong, and is the evidence the tracker uses and re-id lacked.
  spatial_scale: 2.0      # box widths over which that continuity evidence decays
  temporal_scale: 2.0     # seconds over which it decays
  observation_quantile: 0.9  # how much of a track must agree with a stored identity. Chosen on
                            # hand-labelled
                            # returns, where the earlier reasoning (a quantile is more robust than a
                            # max) turns out to cost accuracy rather than buy it. A track that turns
                            # or is partly hidden produces observations that genuinely match nothing
                            # stored, and a median lets those outvote the views that do match.
                            # Separating real returns from different people, K=5: AUROC 0.908 at 0.5,
                            # 0.926 at 0.75, 0.942 at 0.9, 0.951 at 1.0 - and on a sequence held out
                            # of this choice, 0.968 / 0.971 / 0.976 / 0.988, monotone on both.
                            # Returns recovered at a 1% false-merge budget rise 50% -> 56% and,
                            # held out, 70% -> 80%.
                            # Stops short of 1.0, which scores best on that data but lets a SINGLE
                            # frame bind a whole track. The labelled evaluation cannot see that risk:
                            # it attributes each observation to a person separately, so a track that
                            # swapped identity part-way contributes to two people and never appears
                            # as a mixed query. test_a_lone_lucky_frame_does_not_carry_the_track
                            # covers exactly that case, and 1.0 fails it while 0.9 passes.
  test_fraction: 0.3      # held out BY TRACK - a track must never contribute to both sides
  seed: 0

search:
  default_k: 20           # identities the index shortlists before the verifier decides. Counts
                          # identities, not stored vectors - memory.search over-fetches rows so an
                          # identity cannot crowd itself out. At 5 the correct identity was present
                          # only 89% of the time on 18 stored identities, and a candidate that is
                          # never shortlisted can never be matched however good the threshold is; 20
                          # holds it at 100%. Still a shortlist: 30 candidates offered out of 1018.

appearance:
  model: reid             # reid | encoder. A network trained to tell people apart beats a general
                          # encoder at this job and is far smaller: measured across a 3 s gap, recall
                          # at 5% false accepts rises 62.1% -> 83.7% and cost falls ~120 -> 11 ms/crop.
  reid_model_path: data/models/osnet_x0_25_msmt17.onnx
  specialist_labels: [person]  # classes the re-id network is trained for. It is much better than
                               # the general encoder on these and much worse on anything else, so
                               # everything not listed here keeps using the general encoder.
  colour_weight: 0.4      # share of the descriptor taken from clothing colour rather than learned
                          # features. On 30 px pedestrian crops two strangers in dark coats look alike
                          # to the encoder; colour separates them. Measured across a 3 s gap: learned
                          # features alone AUROC 0.912 / 62.1% recall at 5% false accepts, fused 0.930
                          # / 68.8%. 0 disables and falls back to the learned features alone.
  colour_bands: 2         # horizontal bands the colour histogram is split into. One band cannot tell
                          # "dark jacket, blue jeans" from "dark jacket, dark trousers"; two can.
  deep_upper_fraction: 0.6 # the learned half sees only the top of the box, where identity lives; the
                          # colour half sees all of it, since trousers are useless for shape and
                          # informative for colour.
  min_crop_px: 8          # boxes smaller than this carry no usable appearance signal

video:
  embed_for_association: true # compute appearance during tracking, not just for memory. Without it the
                              # tracker is blind: every appearance rule below is inert and two overlapping
                              # people are told apart by box position alone. Costs roughly 90 ms per crop.
  crop_upper_fraction: 0.6   # embed only the top of a box. Head and torso identify a person and are the
                             # last thing an occluder hides. Honest caveat: audited, this buys nothing in
                             # discriminability over a 3 s gap (AUROC 0.902 vs 0.901 full-body) - it mainly
                             # shifts the whole similarity scale down ~0.07, so any threshold calibrated
                             # before this change must be recalibrated after it.
  min_crop_px: 8             # boxes smaller than this carry no usable appearance signal

  detect_every_n_frames: 3   # tracker fills the gaps; 5 confirms tracks too slowly (min_hits*N frames)

anomaly:
  method: knn

  k: 5

  shrinkage: 0.1

  n_estimators: 100   # isoforest

  nu: 0.1             # ocsvm: max fraction of normals outside boundary
  seed: 0

