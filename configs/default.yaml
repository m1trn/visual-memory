# All tunables live here. Never hardcode these in modules.

encoder:
  backend: dinov2          # dinov2 (Meta, ViT-S/14, 384-dim) | radio (NVIDIA C-RADIO, 2304-dim)
  # torch.hub name; small = ViT-S/14, 384-dim embeddings
  name: dinov2_vits14
  input_size: 224          # square resize; multiple of the patch size (14 for DINOv2, 16 for RADIO)
  device: cpu
  batch_size: 16

detector:
  name: yolo11n
  model_path: data/models/yolo11n.onnx
  input_size: 640
  conf_threshold: 0.1
  iou_threshold: 0.50
  classes: null            # list of COCO ids to keep, or null for all
  num_threads: 0           # 0 = onnxruntime default

tracker:
  max_age: 6              # frames without a match before a track is lost; ~2x detect_every_n_frames (higher only breeds ghost boxes coasting on prediction)
  min_hits: 2             # matches before a track is drawn; 1 admits detector junk (67 ids, 37 spurious), 3 only adds latency
  iou_threshold: 0.3      # min IoU to accept a match
  high_conf: 0.5           # detections >= this go to the first association pass
  low_conf: 0.1            # detections in [low_conf, high_conf) go to the second (ByteTrack) pass
  appearance_weight: 0.0  # lambda in cost = (1-lambda)*(1-IoU) + lambda*(1-cosine); 0 = motion only

memory:
  db_path: data/memory.db
  index_path: data/memory.faiss
  exemplars_per_identity: 5   # K
  reid_threshold: 0.80        # cosine, tune after Phase 7

search:
  default_k: 5

video:
  detect_every_n_frames: 3   # tracker fills the gaps; 5 confirms tracks too slowly (min_hits*N frames)

anomaly:
  method: knn
  k: 5
  shrinkage: 0.1
  n_estimators: 100   # isoforest
  nu: 0.1             # ocsvm: max fraction of normals outside boundary
  seed: 0
