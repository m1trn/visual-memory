# All tunables live here. Never hardcode these in modules.

encoder:
  backend: dinov2          # dinov2 (Meta, ViT-S/14, 384-dim) | radio (NVIDIA C-RADIO, 2304-dim)

  # torch.hub name; small = ViT-S/14, 384-dim embeddings

  name: dinov2_vits14

  input_size: 224          # square resize; multiple of the patch size (14 for DINOv2, 16 for RADIO)

  device: cpu

  batch_size: 16

detector:
  name: yolo11n

  model_path: data/models/yolo11n_768.onnx

  input_size: 768          # must match the exported ONNX graph, whose input size is fixed. Match it to
                           # the footage's own width where possible: letterboxing a frame DOWN discards
                           # detail that distant people cannot spare, while upscaling past the size the
                           # network was trained at puts them at a scale it never saw.
                           # Re-export with `yolo export format=onnx imgsz=<size>`.
                           # A larger detector finds more distant people but also more strong false
                           # positives, which spawn tracks that steal matches from easy nearby ones.
                           # Use yolo11n_1280.onnx with input_size 1280 for footage of distant crowds.

  conf_threshold: 0.1

  iou_threshold: 0.50

  classes: null            # list of COCO ids to keep, or null for all

  num_threads: 0           # 0 = onnxruntime default

tracker:
  max_age: 12             # frames without a match before a track is lost. Must outlast a normal
                          # occlusion - a person walking behind something is invisible to the detector
                          # for roughly this long - or they return as a new id. A long memory is only
                          # safe alongside the appearance veto, which blocks the wrong re-associations
                          # it would otherwise permit.

  min_hits: 2             # matches before a track is drawn; 1 admits detector junk, 3 only adds latency

  iou_threshold: 0.3      # IoU at or above this accepts a match outright; below it the centre gate decides

  contested_iou: 0.5      # a detection this deep inside two tracks at once is not safely attributable;
                          # withhold it and let both coast rather than guess and swap their ids
  max_centre_distance: 1.5  # fallback gate in box widths, for the ~6% of true matches that fall under iou_threshold.

                            # Tuned at detect_every_n_frames: 3 - motion per interval scales with the frame skip,

                            # so raising that cadence needs this raised too (roughly 0.7 x the gap in frames).

  measurement_noise: 0.25   # how much the filter distrusts a detection, relative to its own prediction.
                            # Below 1.0 means detections win, so a corrected box lands on its detection
                            # rather than trailing part of the way towards it. Lower still fits the
                            # track's velocity to detection jitter, which costs ids.

  min_exemplar_confidence: 0.3  # a detection below this still associates, but never becomes part of
                                # the record of what somebody looks like. Confidence is also a
                                # statement about the BOX: a weak detection sits mostly on background,
                                # which must not be filed as somebody's appearance. Association is
                                # deliberately NOT gated on it - a weak box is most useful exactly
                                # when someone is half-hidden and geometry cannot arbitrate, which is
                                # what the second association pass is for.

  high_conf: 0.5           # detections >= this go to the first association pass

  low_conf: 0.1            # detections in [low_conf, high_conf) go to the second (ByteTrack) pass

  veto_views: 3           # how many recent observations a track offers the veto; a running mean
                          # resembles none of the views it averages, so raw observations compare better
  claim_margin: 0.0       # refuse a match when a rival track's appearance fits the detection this much
                          # better. Off: appearance inside the association cost does the same job
                          # without the extra identities this costs when it fires.
  appearance_veto: 0.4    # reject a match whose appearance is implausible for the same object.
                          # ONLY ACTIVE when the caller passes embeddings into update(); track_demo and
                          # reid_demo do not, so it is inert there. Raising it starts rejecting correct
                          # matches whose embedding is briefly unstable.
  appearance_weight: 0.5  # share of the association cost taken from appearance rather than geometry:
                          # lambda in cost = (1-lambda)*(1-IoU) + lambda*(1-cosine); 0 = motion only.
                          # Two overlapping people have near-identical geometry, so this is what stops
                          # one of them claiming the other's id. Needs embeddings at update().

  embed_every_n: 2       # schedule for due_for_embedding(); callers passing embeddings into update() rate-limit themselves. 0 disables

  max_exemplars: 16      # per-track appearance buffer; crops are not stored, so this is all a lost track can hand to memory

memory:
  db_path: data/memory.db

  index_path: data/memory.faiss

  exemplars_per_identity: 5   # K

  reid_threshold: 0.80        # cosine, tune after Phase 7

reid:
  verifier: cosine        # cosine | logistic | mlp (the project's own trained pair model)
  verifier_weights: data/models/reid_verifier_mlp.npz  # produced by scripts/reid_train.py
  min_pair_gap: 2         # observations apart, so a positive pair is not two near-identical frames
  max_pairs_per_track: 200 # cap per track, or one long-lived object dominates the positive class
  max_false_merge_rate: 0.02  # share of different-person comparisons allowed to clear the boundary.
                            # The boundary is derived from this rate rather than set directly, so it
                            # re-fits whenever the embedder or the data changes. Too low a rate puts
                            # the boundary under the useful band, where wrong merges cost more
                            # identity than correct recoveries gain and re-identification does more
                            # harm than leaving it off. NOT independent of observation_quantile:
                            # raising that lifts every score, so the same rate lands higher.
  swap_margin: 0.08       # two people on screen who have each other's numbers swap them back when
                          # EACH fits the other's record better than their own by this much. Takeover
                          # only runs when a track is first identified, so without this a swap made
                          # during a crossing lasts until one of them leaves. The condition is mutual
                          # on purpose: one confused frame cannot flip two people. 0 disables.
  min_new_identity_confidence: 0.0  # OFF. A track that never peaked this high AND never moved
                          # still_object_motion box widths would be refused a NEW identity, which
                          # aims at static objects the detector calls people. Off because distant
                          # real people are also detected weakly and have not moved far by their
                          # second view, so any deferral fragments them; a false positive is the
                          # detector's error and belongs there.
  still_object_motion: 0.5  # box widths a weak track must have travelled to count as a person; only
                          # consulted when the bar above is on.
  claim_margin: 0.08      # how much better a match must be to take an identity from its current
                          # holder. Two similar-looking people both score against one stored
                          # record, and without this whichever appeared first keeps it for good.
  merge_margin: 0.15      # extra evidence needed to merge two existing records, beyond what a fresh
                          # binding needs. Merging rewrites history, so it is deliberately the harder
                          # call: set high enough that only blatant duplicates are joined.
  reconsider_every: 15    # frames between revisiting a track's identity as its evidence grows. An
                          # identity assigned from two observations must be allowed to improve, or an
                          # object called new can never reclaim the record of its earlier visit.
  continuity_bonus: 0.15  # how much the appearance bar may be lowered for an object that reappears where
                          # another vanished moments ago. Appearance across a gap is weak; continuity in
                          # space and time is strong, and is the evidence the tracker uses and re-id lacked.
  spatial_scale: 2.0      # box widths over which that continuity evidence decays
  temporal_scale: 2.0     # seconds over which it decays
  observation_quantile: 0.9  # how much of a track must agree with a stored identity. A track that
                            # turns or is partly hidden produces observations that genuinely match
                            # nothing stored, so a low quantile lets those outvote the views that do
                            # match. Stops short of 1.0, which would let a SINGLE lucky frame bind a
                            # whole track.
  test_fraction: 0.3      # held out BY TRACK - a track must never contribute to both sides
  seed: 0

search:
  default_k: 20           # identities the index shortlists before the verifier decides. Counts
                          # identities, not stored vectors - memory.search over-fetches rows so an
                          # identity cannot crowd itself out. A candidate never shortlisted can never
                          # be matched however good the threshold is, so this is set well above the
                          # number of plausible matches rather than tight.

appearance:
  model: reid             # reid | encoder. A network trained to tell people apart beats a general
                          # encoder at this job and is far smaller and faster.
  reid_model_path: data/models/person_reid_youtu_2021nov.onnx  # Tencent YouTu person re-id (OpenCV Zoo,
                          # 107 MB, 768-dim). Embedding runs off the hot path. Its scores sit on their
                          # own scale, so the boundary is re-fitted from data/reid_pairs.pkl by
                          # reid_bench.py, which must be re-run after any embedder swap.
  projection_weights: ""    # path to a trained 768->k projection (scripts/reid_project.py); empty = off.
                          # Changes the person vector, so memory starts empty when switched on.
                          # A trained projection holds its separation on unseen returns at a
                          # fraction of the size, but costs a little end-to-end accuracy. Off by
                          # default: turn it on when memory and search cost matter more.
  specialist_labels: [person]  # classes the re-id network is trained for. It is much better than
                               # the general encoder on these and much worse on anything else, so
                               # everything not listed here keeps using the general encoder.
  colour_weight: 0.4      # share of the descriptor taken from clothing colour rather than learned
                          # features. On small pedestrian crops two strangers in dark coats look alike
                          # to the encoder, and colour separates them; the two halves are
                          # complementary rather than redundant. 0 falls back to learned features.
  colour_bands: 2         # horizontal bands the colour histogram is split into. One band cannot tell
                          # "dark jacket, blue jeans" from "dark jacket, dark trousers"; two can.
  deep_upper_fraction: 0.6 # the learned half sees only the top of the box, where identity lives; the
                          # colour half sees all of it, since trousers are useless for shape and
                          # informative for colour.
  min_crop_px: 8          # boxes smaller than this carry no usable appearance signal

video:
  embed_for_association: true # compute appearance during tracking, not just for memory. Without it the
                              # tracker is blind: every appearance rule below is inert and two overlapping
                              # people are told apart by box position alone. Costs roughly 90 ms per crop.
  crop_upper_fraction: 0.6   # embed only the top of a box. Head and torso identify a person and are the
                             # last thing an occluder hides. Honest caveat: audited, this buys nothing in
                             # discriminability over a 3 s gap (AUROC 0.902 vs 0.901 full-body) - it mainly
                             # shifts the whole similarity scale down ~0.07, so any threshold calibrated
                             # before this change must be recalibrated after it.
  min_crop_px: 8             # boxes smaller than this carry no usable appearance signal

  detect_every_n_frames: 3   # tracker fills the gaps; 5 confirms tracks too slowly (min_hits*N frames)

anomaly:
  method: knn

  k: 5

  shrinkage: 0.1

  n_estimators: 100   # isoforest

  nu: 0.1             # ocsvm: max fraction of normals outside boundary
  seed: 0


language:                 # finding remembered objects by description
  model_name: ViT-B-32
  pretrained: laion2b_s34b_b79k
                          # Chosen for speed on a CPU. A smaller architecture is not automatically
                          # faster: models designed for phone neural engines can run slower under
                          # desktop PyTorch than a larger conventional transformer.
  batch_size: 16
  min_score: 0.22         # cosine below which a hit is not a match but the least-bad row in the
                          # index. Text-image cosine lives on a far tighter scale than image-image:
                          # a good hit sits near 0.28, not near 0.8. Without a floor an empty scene
                          # still returns k confident-looking answers, so this is what
                          # makes "nothing here matches that" expressible.
